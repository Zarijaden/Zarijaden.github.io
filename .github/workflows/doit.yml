name: Upstream Sync

permissions:
  contents: write

on:
  #schedule:
  #  - cron: "0 17 * * 5"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}   # ✅ 用 PAT，避免 workflow 权限问题

      - name: Sync with upstream (keep local workflow)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/Zarijaden/blog.git || true
          git fetch upstream

          # 1. 强制对齐上游
          git reset --hard upstream/main

          # 2. 恢复你自己的 deploy workflow
          git checkout HEAD -- .github/workflows/deploy.yml

          # 3. 提交并强推
          git commit -am "Sync upstream content, keep local deploy workflow" || true
          git push origin main --force
