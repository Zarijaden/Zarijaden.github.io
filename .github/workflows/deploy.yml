jobs:
  blog:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # 从 v2 升级到 v4

      - uses: actions/setup-node@v4        # 从 v2 升级到 v4
        with:
          node-version: '18'               # 建议显式指定，与 Cloudflare 对齐
          cache: 'npm'                     # v4 内置缓存，可替代单独的 cache action

      - name: Install dependencies
        run: |
          npm ci                           # 推荐使用 ci 代替 install，保证一致性
          echo "init node successful"

      - name: Install Hexo CLI
        run: |
          npm install -g hexo-cli
          echo "install hexo successful"

      - name: Build Blog
        run: |
          hexo clean
          hexo g
          echo "build blog successful"

      - name: Deploy Blog
        run: |
          git config --global user.name "Zarijaden"
          git config --global user.email "Zarijaden@gmail.com"
          hexo deploy

      - run: echo "Deploy Successful!"