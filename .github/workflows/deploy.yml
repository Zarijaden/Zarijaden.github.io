name: Hexo Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # 如果你的默认分支是 master，请改为 master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      # with:
      #   submodules: 'recursive'

    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    # 🆕 关键改动：修改 root 路径为 /blog/
    - name: Fix root path for GitHub Pages
      run: |
        # 先把原始的 _config.yml 备份一下（可选，不备份也没事，因为只在 CI 环境里改动）
        # 把 root: / 替换成 root: /blog/
        sed -i 's|^root: /$|root: /blog/|' _config.yml
        # 验证一下修改结果（方便调试，可以在 Actions 日志里看到）
        echo "修改后的 root 配置："
        grep "^root:" _config.yml || echo "⚠️ 未找到 root 配置"

    - name: Generate Static Files
      run: npx hexo generate

    - name: Deploy to gh-pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: ./public
        force_orphan: false
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
        commit_message: 'Auto-deploy by GitHub Actions [skip ci]'