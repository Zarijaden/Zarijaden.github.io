name: Deploy Hexo to GitHub Pages

on:
  push:
    branches:
      - main # 触发部署的分支。如果你的源代码主分支叫 master，请将其改为 master

# 赋予 Action 部署到 GitHub Pages 所需的最高权限
permissions:
  contents: read
  pages: write
  id-token: write

# 限制并发部署，避免旧版本覆盖新版本
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码 (Checkout Repository)
        uses: actions/checkout@v4
        with:
          # 如果你的 island 主题或其他插件是通过 git clone 引入的子模块，这行保证它们能被正确拉取
          submodules: 'recursive' 
          fetch-depth: 0

      - name: 设置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # 开启 npm 缓存，加快后续构建速度

      - name: 安装依赖与构建 (Build Hexo)
        run: |
          npm install
          npx hexo generate

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v4

      - name: 上传构建产物 (Upload Artifact)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public' # Hexo 默认生成的静态文件目录

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
